[package]
name = "nc-build"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository.workspace = true
description = "Plans, shards and places builds, checks, tests and simulator runs for a Rust workspace"

[[bin]]
name = "nc-build"
path = "src/main.rs"
bench = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-build-opt = { path = "../../crates/runtime/build-opt" }
serde_json.workspace = true

[lints]
workspace = true
